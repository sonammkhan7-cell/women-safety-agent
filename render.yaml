services:
  - type: web
    name: women-safety-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://women-safety-agent-web.onrender.com
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: LOCATIONIQ_API_KEY
        sync: false

  - type: web
    name: women-safety-agent-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://women-safety-agent-api.onrender.com/api/v1
      - key: VITE_LOCATIONIQ_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
